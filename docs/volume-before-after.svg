<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="620" viewBox="0 0 1520 620" role="img" aria-labelledby="title desc">
  <title id="title">Sony volume display and Bento volume island compared</title>
  <desc id="desc">An illustrated film scene appears twice. Sony's bottom display covers the subtitle on the left. Bento's dial sits at the left edge of the right scene, leaving the subtitle clear. Overlays are enlarged for clarity.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#354451"/><stop offset="1" stop-color="#b3a08d"/></linearGradient>
    <linearGradient id="shade" x2="0" y2="1"><stop offset=".5" stop-color="#080b10" stop-opacity="0"/><stop offset="1" stop-color="#080b10" stop-opacity=".8"/></linearGradient>
    <clipPath id="screen"><rect width="704" height="396" rx="12"/></clipPath>
    <g id="scene">
      <rect width="704" height="396" fill="url(#sky)"/>
      <circle cx="519" cy="104" r="34" fill="#e6cab0" opacity=".85"/>
      <path d="M0 225 72 177 130 197 235 95 347 209 411 163 488 209 584 155 704 203V396H0Z" fill="#485159"/>
      <path d="M0 282 103 243 220 272 333 197 451 262 559 236 704 274V396H0Z" fill="#2c383d"/>
      <path d="M0 335 115 310 221 333 370 280 529 310 704 277V396H0Z" fill="#17282d"/>
      <path d="M258 396 351 305 366 301 310 396Z" fill="#61716f" opacity=".35"/>
      <rect width="704" height="396" fill="url(#shade)"/>
      <text x="352" y="352" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" stroke="#000" stroke-width="3" paint-order="stroke">We still have a long way to go.</text>
    </g>
    <g id="speaker" fill="none" stroke="#fff" stroke-linejoin="round" stroke-linecap="round" stroke-width="2">
      <path d="M0 8H5L12 2V22L5 16H0Z" fill="#fff" stroke="none"/>
      <path d="M16 7Q22 12 16 17M20 3Q30 12 20 21"/>
    </g>
  </defs>
  <rect width="1520" height="620" rx="20" fill="#101112"/>
  <g font-family="Arial, sans-serif">
    <text x="32" y="50" fill="#8e9295" font-size="14" font-weight="700" letter-spacing="2">BEFORE</text>
    <text x="32" y="86" fill="#f5f3ee" font-size="27" font-weight="600">Sony’s system display</text>
    <text x="784" y="50" fill="#ff601b" font-size="14" font-weight="700" letter-spacing="2">AFTER</text>
    <text x="784" y="86" fill="#f5f3ee" font-size="27" font-weight="600">Bento’s volume island</text>
